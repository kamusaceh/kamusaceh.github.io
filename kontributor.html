<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil Admin — Kamus Bahasa Acèh</title>
<link rel="stylesheet" href="style.css?v=1788675998045">
</head>
<body>

<header>
  <h1><a href="/">Kamus Bahasa Acèh</a></h1>
  <div id="auth-area"></div>
</header>

<main>
  <section id="view-profil">Memuat…</section>
</main>

<div id="login-modal" style="display:none">
  <form id="login-form">
    <h2>Login Admin</h2>
    <label>Username <input name="username" required></label>
    <label>Password <input name="password" type="password" required></label>
    <button type="submit">Masuk</button>
    <button type="button" id="btn-close-login">Batal</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<script src="kamus.js?v=1788675998045"></script>
<script>
const viewProfil = document.getElementById("view-profil");
const authArea = document.getElementById("auth-area");
const loginModal = document.getElementById("login-modal");

function renderAuthArea() {
  authArea.innerHTML = currentAdmin
    ? `<a href="/kontributor/${currentAdmin.username}" class="profil-saya-link">Profil Saya</a> <span>Login: ${escapeHtml(currentAdmin.nama)}</span> <button id="btn-logout">Keluar</button>`
    : `<button id="btn-login">Login</button>`;
  document.getElementById(currentAdmin ? "btn-logout" : "btn-login")
    .addEventListener("click", () => {
      if (currentAdmin) { logoutAdmin(); renderAuthArea(); }
      else { loginModal.style.display = "flex"; }
    });
}
const sessionReady = restoreAdminSession();
(async function initAuth() {
  await sessionReady;
  renderAuthArea();
})();

document.getElementById("btn-close-login").addEventListener("click", () => loginModal.style.display = "none");

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const ok = await loginAdmin(fd.get("username"), fd.get("password"));
  const err = document.getElementById("login-error");
  if (ok) {
    loginModal.style.display = "none";
    renderAuthArea();
    e.target.reset();
  } else {
    err.textContent = "Username atau password salah.";
  }
});

/* ---------- ambil username: dari 404-redirect (sessionStorage), query, atau path ---------- */
function getUsernameFromURL() {
  const fromRedirect = sessionStorage.getItem("kamus_redirect_kontributor");
  if (fromRedirect) {
    sessionStorage.removeItem("kamus_redirect_kontributor");
    history.replaceState(null, "", `/kontributor/${fromRedirect}`);
    return fromRedirect;
  }
  const params = new URLSearchParams(location.search);
  if (params.get("u")) return params.get("u");
  const m = location.pathname.match(/^\/kontributor\/([^/]+)\/?$/);
  return m ? m[1] : null;
}

async function loadProfil() {
  const username = getUsernameFromURL();
  if (!username) { viewProfil.innerHTML = "<p>Username tidak ditentukan.</p>"; return; }
  const admin = await fetchAdminByUsername(username);
  if (!admin) { viewProfil.innerHTML = `<p>Admin "${escapeHtml(username)}" tidak ditemukan.</p>`; return; }
  const contributions = await fetchContributions(username);
  renderProfil(viewProfil, admin, contributions);
}

/* klik kata di riwayat kontribusi → tetap navigasi biasa ke /entri/<slug> */
window.addEventListener("popstate", loadProfil);
(async function initProfil() {
  await sessionReady;
  loadProfil();
})();
</script>
</body>
</html>
