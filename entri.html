<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamus Bahasa Acèh</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1><a href="/">Kamus Bahasa Acèh</a></h1>
  <div id="auth-area"></div>
</header>

<main>
  <section id="view-entri">Memuat…</section>
</main>

<div id="login-modal" style="display:none">
  <form id="login-form">
    <h2>Login Admin</h2>
    <label>Username <input name="username" required></label>
    <label>Password <input name="password" type="password" required></label>
    <button type="submit">Masuk</button>
    <button type="button" id="btn-close-login">Batal</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<script src="kamus.js"></script>
<script>
const viewEntri = document.getElementById("view-entri");
const authArea = document.getElementById("auth-area");
const loginModal = document.getElementById("login-modal");

function renderAuthArea() {
  authArea.innerHTML = currentAdmin
    ? `<span>Login: ${escapeHtml(currentAdmin.nama)}</span> <button id="btn-logout">Keluar</button>`
    : `<button id="btn-login">Login</button>`;
  document.getElementById(currentAdmin ? "btn-logout" : "btn-login")
    .addEventListener("click", () => {
      if (currentAdmin) { logoutAdmin(); renderAuthArea(); loadEntri(); }
      else { loginModal.style.display = "flex"; }
    });
}
renderAuthArea();

document.getElementById("btn-close-login").addEventListener("click", () => loginModal.style.display = "none");

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const ok = await loginAdmin(fd.get("username"), fd.get("password"));
  const err = document.getElementById("login-error");
  if (ok) {
    loginModal.style.display = "none";
    renderAuthArea();
    loadEntri(); // render ulang supaya tombol admin muncul
    e.target.reset();
  } else {
    err.textContent = "Username atau password salah.";
  }
});

/* ---------- ambil slug: dari 404-redirect (sessionStorage), query, atau path ---------- */
function getSlugFromURL() {
  const fromRedirect = sessionStorage.getItem("kamus_redirect_slug");
  if (fromRedirect) {
    sessionStorage.removeItem("kamus_redirect_slug");
    history.replaceState(null, "", `/entri/${fromRedirect}`);
    return fromRedirect;
  }
  const params = new URLSearchParams(location.search);
  if (params.get("slug")) return params.get("slug");
  const m = location.pathname.match(/^\/entri\/([^/]+)\/?$/);
  return m ? m[1] : null;
}

async function loadEntri() {
  const slug = getSlugFromURL();
  if (!slug) { viewEntri.innerHTML = "<p>Kata tidak ditentukan.</p>"; return; }
  const letter = firstLetter(slug);
  try {
    const data = await fetchWordData(letter, slug);
    renderEntri(viewEntri, data, slug, letter);
  } catch (e) {
    viewEntri.innerHTML = `<p>Kata "${escapeHtml(slug)}" tidak ditemukan.</p>`;
  }
}

/* klik chip rujukan → ganti konten di halaman yang sama (tanpa reload) */
viewEntri.addEventListener("click", (e) => {
  const chip = e.target.closest(".rujukan-chip");
  if (chip) {
    e.preventDefault();
    history.pushState(null, "", `/entri/${chip.dataset.slug}`);
    loadEntri();
    return;
  }
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  handleAdminAction(btn.dataset.action);
});

async function handleAdminAction(action) {
  const el = viewEntri.querySelector(".entri");
  const slug = el.dataset.slug, letter = el.dataset.letter;
  if (action === "hapus") {
    if (confirm(`Hapus kata "${slug}"? Tindakan ini akan membuat commit di GitHub.`)) {
      await deleteWord(letter, slug);
      location.href = "/";
    }
  } else if (action === "ubah") {
    // form ubah lengkap ada di homepage.html — arahkan ke sana dengan slug terpilih
    location.href = `/?ubah=${slug}`;
  }
}

window.addEventListener("popstate", loadEntri);
loadEntri();
</script>
</body>
</html>
