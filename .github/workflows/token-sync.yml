name: Auto Process Pending Entries

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  process-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode Token & Sync
        run: |
          RAW_TOKEN=$(cat token.txt | tr -d '\r\n')
          if [[ "$RAW_TOKEN" =~ ^[0-9a-fA-F]+$ ]]; then
            REAL_TOKEN=$(echo "$RAW_TOKEN" | xxd -r -p)
          else
            REAL_TOKEN="$RAW_TOKEN"
          fi
          
          SECRET_API_KEY="$REAL_TOKEN" node setup.js --sync

      - name: Commit & Push
        run: |
          git config --global user.name "Kamus Aceh Bot"
          git config --global user.email "bot@kamusaceh.github.io"
          git add db/
          git commit -m "auto: update database shards [skip ci]" || exit 0
          git push