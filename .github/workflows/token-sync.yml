name: Auto Process Pending Entries

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  process-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read & Decode Token & Process
        run: |
          if [ -f token.txt ]; then
            LOCAL_TOKEN=$(node -e '
              const fs = require("fs");
              const raw = fs.readFileSync("token.txt", "utf8").trim();
              if (/^[0-9a-fA-F]+$/.test(raw) && raw.length % 2 === 0) {
                let str = "";
                for (let i = 0; i < raw.length; i += 2) {
                  str += String.fromCharCode(parseInt(raw.substr(i, 2), 16));
                }
                console.log(str);
              } else {
                try { console.log(Buffer.from(raw, "base64").toString("utf8")); }
                catch(e) { console.log(raw); }
              }
            ')
            echo "Token berhasil didekripsi dari token.txt"
            SECRET_API_KEY="$LOCAL_TOKEN" node setup.js --sync
          else
            echo "token.txt tidak ditemukan"
            node setup.js --sync
          fi

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Kamus Aceh Bot"
          git config --global user.email "bot@kamusaceh.github.io"
          git add db/
          git commit -m "auto: sync pending entries & update database shards [skip ci]" || exit 0
          git push