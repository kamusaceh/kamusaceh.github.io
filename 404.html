<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Mengalihkan…</title>
</head>
<body>
<script>
  // GitHub Pages menampilkan file ini kalau path yang diminta tidak ada
  // file fisiknya, mis. /entri/bloe. Kita deteksi path itu, simpan slug-nya,
  // lalu redirect ke entri.html — yang nanti menulis ulang address bar
  // balik ke /entri/bloe pakai history.replaceState (tanpa reload).
  const mEntri = location.pathname.match(/^\/entri\/([^/]+)\/?$/);
  const mKontributor = location.pathname.match(/^\/kontributor\/([^/]+)\/?$/);
  if (mEntri) {
    sessionStorage.setItem("kamus_redirect_slug", mEntri[1]);
    location.replace("/entri.html");
  } else if (mKontributor) {
    sessionStorage.setItem("kamus_redirect_kontributor", mKontributor[1]);
    location.replace("/kontributor.html");
  } else {
    // path lain yang tidak dikenal → balik ke homepage
    location.replace("/");
  }
</script>
</body>
</html>
