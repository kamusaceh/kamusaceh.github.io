<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Mengalihkan…</title></head><body><script>
  const mEntri = location.pathname.match(/^\/entri\/([^/]+)\/?$/);
  const mKontributor = location.pathname.match(/^\/kontributor\/([^/]+)\/?$/);
  if (mEntri) {
    sessionStorage.setItem("kamus_redirect_slug", mEntri[1]);
    location.replace("/entri.html");
  } else if (mKontributor) {
    sessionStorage.setItem("kamus_redirect_kontributor", mKontributor[1]);
    location.replace("/kontributor.html");
  } else {
    location.replace("/");
  }
</script></body></html>
