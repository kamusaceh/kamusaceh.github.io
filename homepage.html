<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kamus Bahasa Acèh</title><link rel="stylesheet" href="style.css?v=1788679220981"></head><body>
<header><h1><a href="/">Kamus Bahasa Acèh</a></h1><div id="auth-area"></div></header>
<main><section id="view-list"><input type="text" id="search" placeholder="Ketik kata Acèh…" autocomplete="off"><div id="stats-area" class="stats-area"></div><div id="results"></div><button id="btn-tambah" style="display:none">+ Tambah Kata</button></section>
<section id="view-entri" style="display:none"></section>
<section id="view-profil" style="display:none"></section>
<section id="view-form" style="display:none"><h2 id="form-title">Tambah Kata</h2><form id="word-form"><label>Kata Acèh <input name="word" required></label><label>Kelas kata <input name="pos" placeholder="n, v, adj"></label><label>Arti <input name="meaning" required></label><div id="examples-area"></div><button type="button" id="btn-add-example">+ Contoh</button><label>Rujukan <input name="rujukan" placeholder="parek, tumpoe"></label><label>Sumber <input name="sumber"></label><button type="submit">Simpan</button><button type="button" id="btn-cancel-form">Batal</button></form></section></main>
<div id="login-modal" style="display:none"><form id="login-form"><h2>Login Admin</h2><label>Username <input name="username" required></label><label>Password <input name="password" type="password" required></label><button type="submit">Masuk</button><button type="button" id="btn-close-login">Batal</button><p id="login-error" class="error"></p></form></div>
<script src="kamus.js?v=1788679220981"></script>
<script>
const results = document.getElementById("results");
const search = document.getElementById("search");
const viewList = document.getElementById("view-list");
const viewEntri = document.getElementById("view-entri");
const viewProfil = document.getElementById("view-profil");
const viewForm = document.getElementById("view-form");
const authArea = document.getElementById("auth-area");
const loginModal = document.getElementById("login-modal");

function renderAuthArea() {
  authArea.innerHTML = currentAdmin
    ? `<a href="/kontributor/${currentAdmin.username}" class="profil-link" data-username="${currentAdmin.username}">Profil</a> <span>${escapeHtml(currentAdmin.nama)}</span> <button id="btn-logout">Keluar</button>`
    : `<button id="btn-login">Login</button>`;
  document.getElementById(currentAdmin ? "btn-logout" : "btn-login").addEventListener("click", () => {
    if (currentAdmin) {
      logoutAdmin();
      renderAuthArea();
      document.getElementById("btn-tambah").style.display = "none";
    } else {
      loginModal.style.display = "flex";
    }
  });
}

const sessionReady = restoreAdminSession();
(async function initAuth() {
  await sessionReady;
  renderAuthArea();
  if (currentAdmin) document.getElementById("btn-tambah").style.display = "inline-block";
})();

document.getElementById("btn-close-login").addEventListener("click", () => { loginModal.style.display = "none"; });

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const ok = await loginAdmin(fd.get("username"), fd.get("password"));
  const err = document.getElementById("login-error");
  if (ok) {
    err.textContent = "";
    loginModal.style.display = "none";
    renderAuthArea();
    document.getElementById("btn-tambah").style.display = "inline-block";
    e.target.reset();
  } else {
    err.textContent = "Username atau password salah.";
  }
});

document.getElementById("btn-tambah").addEventListener("click", () => showForm());

let debounceTimer;
search.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(doSearch, 200);
});

async function doSearch() {
  const q = search.value.trim();
  if (!q) { results.innerHTML = ""; return; }
  const letter = firstLetter(q);
  const list = await fetchIndex(letter);
  const qNorm = stripDiacritics(q.toLowerCase());
  const filtered = list.filter(item => stripDiacritics(item.word.toLowerCase()).startsWith(qNorm));
  results.innerHTML = filtered.length
    ? filtered.map(item => `<a href="/entri/${item.slug}" class="word-link" data-slug="${item.slug}" data-letter="${letter}"><strong>${escapeHtml(item.word)}</strong> — ${escapeHtml(item.meaning)}</a>`).join("")
    : `<p>Tidak ditemukan.</p>`;
}

async function loadStats() {
  const area = document.getElementById("stats-area");
  if (!area) return;
  try {
    const stats = await fetchStats();
    area.textContent = `${stats.wordCount || 0} kata · ${stats.editCount || 0} suntingan`;
  } catch (e) {}
}
loadStats();

document.body.addEventListener("click", (e) => {
  const link = e.target.closest(".word-link, .rujukan-chip, .kontrib-word");
  if (link) {
    e.preventDefault();
    const slug = link.dataset.slug;
    const letter = link.dataset.letter || firstLetter(slug);
    showEntri(slug, letter, true);
    return;
  }
  const profilLink = e.target.closest(".profil-link");
  if (profilLink) {
    e.preventDefault();
    showProfil(profilLink.dataset.username, true);
  }
});

async function showEntri(slug, letter, pushState) {
  try {
    const data = await fetchWordData(letter, slug);
    viewList.style.display = "none";
    viewForm.style.display = "none";
    viewProfil.style.display = "none";
    viewEntri.style.display = "block";
    renderEntri(viewEntri, data, slug, letter);
    renderEntriActions(data, slug, letter);
    if (pushState) history.pushState(null, "", `/entri/${slug}`);
  } catch (e) {
    viewEntri.innerHTML = `<p>Kata tidak ditemukan.</p>`;
  }
}

function renderEntriActions(data, slug, letter) {
  const footer = document.createElement("div");
  footer.className = "entri-footer";
  const riwayatBtn = document.createElement("button");
  riwayatBtn.type = "button";
  riwayatBtn.textContent = "Riwayat";
  riwayatBtn.addEventListener("click", () => openHistoryModal(letter, slug, data.word));
  footer.appendChild(riwayatBtn);
  if (currentAdmin) {
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.textContent = "Ubah";
    editBtn.addEventListener("click", () => showForm(data, letter, slug));
    footer.appendChild(editBtn);
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.textContent = "Hapus";
    delBtn.addEventListener("click", async () => {
      if (!confirm(`Hapus kata "${data.word}"?`)) return;
      try {
        await deleteWord(letter, slug);
        loadStats();
        showList(true);
      } catch (err) {
        alert("Gagal hapus: " + err.message);
      }
    });
    footer.appendChild(delBtn);
  }
  viewEntri.appendChild(footer);
}

async function showProfil(username, pushState) {
  viewList.style.display = "none";
  viewEntri.style.display = "none";
  viewForm.style.display = "none";
  viewProfil.style.display = "block";
  try {
    const admin = await fetchAdminByUsername(username);
    if (!admin) throw new Error("Kontributor tidak ditemukan");
    const contributions = await fetchContributions(username);
    const totalTambah = contributions.filter(c => c.action === "tambah").length;
    const totalUbah = contributions.filter(c => c.action === "ubah").length;
    const listHtml = contributions.length
      ? contributions.map(c => `<div class="kontrib-item"><a href="/entri/${c.slug}" class="kontrib-word" data-slug="${c.slug}" data-letter="${c.letter}">${escapeHtml(c.word)}</a><span class="kontrib-action">${escapeHtml(c.action)}</span><span class="kontrib-date">${formatTanggalRiwayat(c.at)}</span></div>`).join("")
      : "<p>Belum ada kontribusi.</p>";
    viewProfil.innerHTML = `<div class="profil"><h1>${escapeHtml(admin.nama)}</h1><p class="profil-username">@${escapeHtml(admin.username)}</p><div class="profil-stats"><div class="stat"><strong>${contributions.length}</strong><span>Total kontribusi</span></div><div class="stat"><strong>${totalTambah}</strong><span>Kata ditambah</span></div><div class="stat"><strong>${totalUbah}</strong><span>Kata diubah</span></div></div><div class="kontrib-list">${listHtml}</div></div>`;
    if (pushState) history.pushState(null, "", `/kontributor/${username}`);
  } catch (e) {
    viewProfil.innerHTML = `<p>${escapeHtml(e.message)}</p>`;
  }
}

function showList(pushState) {
  viewEntri.style.display = "none";
  viewForm.style.display = "none";
  viewProfil.style.display = "none";
  viewList.style.display = "block";
  if (pushState) history.pushState(null, "", "/homepage.html");
}

let editingLetter = null, editingSlug = null;
const examplesArea = document.getElementById("examples-area");

function addExampleRow(aceh = "", indo = "") {
  const row = document.createElement("div");
  row.className = "example-row";
  row.innerHTML = `<input placeholder="Acèh" class="ex-aceh" value="${escapeHtml(aceh)}"><input placeholder="Indo" class="ex-indo" value="${escapeHtml(indo)}"><button type="button" class="ex-remove">×</button>`;
  row.querySelector(".ex-remove").addEventListener("click", () => row.remove());
  examplesArea.appendChild(row);
}

document.getElementById("btn-add-example").addEventListener("click", () => addExampleRow());

function showForm(data = null, letter = null, slug = null) {
  editingLetter = letter; editingSlug = slug;
  document.getElementById("form-title").textContent = data ? `Ubah: ${data.word}` : "Tambah Kata";
  const form = document.getElementById("word-form");
  form.word.value = data?.word || "";
  form.pos.value = data?.pos || "";
  form.meaning.value = data?.meaning || "";
  form.rujukan.value = (data?.rujukan || []).join(", ");
  form.sumber.value = data?.sumber || "";
  examplesArea.innerHTML = "";
  (data?.examples || [{ aceh: "", indo: "" }]).forEach(ex => addExampleRow(ex.aceh, ex.indo));
  viewList.style.display = "none";
  viewEntri.style.display = "none";
  viewProfil.style.display = "none";
  viewForm.style.display = "block";
}

document.getElementById("btn-cancel-form").addEventListener("click", () => showList(true));

document.getElementById("word-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const examples = [...examplesArea.querySelectorAll(".example-row")]
    .map(row => ({ aceh: row.querySelector(".ex-aceh").value.trim(), indo: row.querySelector(".ex-indo").value.trim() }))
    .filter(ex => ex.aceh || ex.indo);
  const entry = {
    word: fd.get("word").trim(),
    pos: fd.get("pos").trim(),
    meaning: fd.get("meaning").trim(),
    examples,
    rujukan: fd.get("rujukan").split(",").map(s => s.trim()).filter(Boolean),
    sumber: fd.get("sumber").trim()
  };
  try {
    if (editingSlug) {
      await editWord(editingLetter, editingSlug, entry);
      showEntri(editingSlug, editingLetter, true);
    } else {
      const slug = await addWord(entry);
      showEntri(slug, firstLetter(entry.word), true);
    }
    loadStats();
  } catch (err) {
    alert("Gagal: " + err.message);
  }
});

(async function initRoute() {
  await sessionReady;
  let path = location.pathname;
  const redirected = sessionStorage.getItem("kamus_redirect_path");
  if (redirected) {
    sessionStorage.removeItem("kamus_redirect_path");
    path = redirected;
  }
  const mEntri = path.match(/^\/entri\/([^/]+)\/?$/);
  const mKontributor = path.match(/^\/kontributor\/([^/]+)\/?$/);
  if (mEntri) showEntri(mEntri[1], firstLetter(mEntri[1]), false);
  else if (mKontributor) showProfil(mKontributor[1], false);
})();
</script></body></html>
