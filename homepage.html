<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kamus Basa Aceh</title>
<link rel="stylesheet" href="assets/style.css">
</head>

<body>

<header>

<div class="mark chrome">
KAMUS DWIBAHASA · KONTRIBUSI TERBUKA
</div>

<h1>Kamus Basa Aceh</h1>

<div class="tagline">
Aceh–Indonesia, disusun bersama oleh penutur dan peminat basa Aceh
</div>

<input
id="search"
type="text"
placeholder="Cari kata…"
autocomplete="off">

<div id="stats"></div>

<div id="authArea"
class="auth-area"></div>

</header>

<main>

<div class="wotd" id="wotd"></div>

<div id="list"></div>

<div
id="addPanel"
class="panel"
style="display:none">
</div>

<div
id="editPanel"
class="panel"
style="display:none">
</div>

<div
id="pendingPanel"
class="panel"
style="display:none">
</div>

<div
id="historyPanel"
class="panel"
style="display:none">
</div>

</main>

<footer>
Kamus Basa Aceh © Komunitas Penutur Bahasa Aceh
</footer>

<script src="config/app-config.js"></script>
<script src="assets/script.js"></script>

</body>
</html>
